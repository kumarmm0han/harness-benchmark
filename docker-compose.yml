# SOP demo — React (nginx) + Spring Boot + PostgreSQL (NFR-001, DR-001, DES-017).
# Non-default host ports 18080 (backend) / 13000 (frontend) / 15432 (db), overridable via
# SOPDEMO_BACKEND_HOST_PORT / SOPDEMO_UI_HOST_PORT / SOPDEMO_DB_HOST_PORT. Startup waits for
# readiness via healthchecks + `docker compose up --wait` (never fixed sleeps). The named
# volume persists drafts and publications across restarts; `docker compose down -v` removes it.
name: sopdemo

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sopdemo
      POSTGRES_USER: sopdemo
      POSTGRES_PASSWORD: sopdemo
    volumes:
      - sopdemo_pgdata:/var/lib/postgresql/data
    ports:
      - "${SOPDEMO_DB_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sopdemo -d sopdemo"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sopdemo
      SPRING_DATASOURCE_USERNAME: sopdemo
      SPRING_DATASOURCE_PASSWORD: sopdemo
      # Enable the deterministic, idempotent seed on the demo profile (DR-003).
      SOPDEMO_SEED_ENABLED: "true"
      # CORS limited to the local UI origin the browser actually uses (IR-001, DES-012).
      SOPDEMO_CORS_ALLOW_ORIGIN: "http://localhost:${SOPDEMO_UI_HOST_PORT:-13000}"
    ports:
      - "${SOPDEMO_BACKEND_HOST_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${SOPDEMO_UI_HOST_PORT:-13000}:80"
    healthcheck:
      # Explicit IPv4 loopback (alpine resolves `localhost` to `::1` first, which nginx
      # does not listen on); 127.0.0.1 is always correct here.
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  sopdemo_pgdata:
