services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sop
      POSTGRES_USER: sop
      POSTGRES_PASSWORD: local-demo-only
    volumes:
      - sop-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sop -d sop"]
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/sop
      DB_USER: sop
      DB_PASSWORD: local-demo-only
      SPRING_PROFILES_ACTIVE: demo
      UI_ORIGIN: http://localhost:${UI_PORT:-5173}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${UI_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  sop-data:
