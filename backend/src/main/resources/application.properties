spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sop}
spring.datasource.username=${DB_USER:sop}
spring.datasource.password=${DB_PASSWORD:local-demo-only}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.deserialization.accept-float-as-int=false
spring.mvc.problemdetails.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
app.ui-origin=${UI_ORIGIN:http://localhost:5173}
