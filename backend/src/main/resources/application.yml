# Local-only demo defaults. Compose overrides via env vars.
spring:
  application:
    name: sop-backend
  datasource:
    url: jdbc:postgresql://db:5432/sop
    username: sop
    password: sop
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
# fixed demo identities (DR-003)
app:
  demo:
    author: demo-author
    consumer: demo-consumer
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
server:
  port: 8080
  error:
    include-message: never
