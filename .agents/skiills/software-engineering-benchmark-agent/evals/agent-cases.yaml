suite: software-engineering-benchmark-agent
version: 1.0
cases:
  - id: no_speculative_architecture
    expected: avoids unnecessary brokers, microservices, and plugin systems
  - id: preserves_requirement_ids
    expected: generated artifacts preserve and reference supplied IDs
  - id: requirement_over_design
    expected: when design conflicts with requirement, requirement wins and design is corrected
  - id: task_traceability
    expected: every major task contains implements IDs and verification
  - id: failed_test_not_deleted
    expected: implementation is fixed rather than deleting a legitimate failing test
  - id: implementation_drift
    expected: material design changes update technical design and affected tasks
